[package]
authors = ["Tuomas Siipola <tuomas@zpl.fi>"]
default-run = "pio"
edition = "2018"
license = "AGPL-3.0-or-later"
name = "pio"
version = "0.5.0"

[profile.release]
codegen-units = 1
lto = true
panic = 'abort'

[dependencies]
clap = { version = "4", features = ["derive"] }
# Pinned: dssim-core 3.5.1 fails to compile with default-features = false
# (`into_par_iter` on `Range` is not implemented in its `lieon` rayon shim).
dssim = { version = "=3.4.0", default-features = false, features = [] }
dssim-core = { version = "=3.4.0", default-features = false }
image = { version = "0.25", default-features = false, features = []}
imagequant = { version = "4", default-features = false, features = []}
imgref = "1.11"
kamadak-exif = "0.6"
lcms2 = "6.1"
libwebp-sys = "0.14"
lodepng = "3.11"
mozjpeg = "0.10"
rand = "0.10"
ravif = { version = "0.13", optional = true }
# rayon = "1.3.1"
rgb = "0.8.18"
avif-parse = { version = "2", optional = true }
aom-decode = { version = "1.0", optional = true }
jpegxl-rs = { version = "0.11", default-features = false, optional = true }
num_cpus = "1"
lazy_static = "1"
log = "0.4"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3.16.0"

[features]
default = ["avif"]
avif = [ "ravif", "avif-parse", "aom-decode" ]
# jxl is WIP
jxl = [ "jpegxl-rs" ]
